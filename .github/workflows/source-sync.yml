name: QA Nexo Cirúrgico MB04 Lote 2
on:
  push:
    paths:
      - 'project-source.tar.gz'
      - '.github/workflows/source-sync.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair código completo
        run: tar -xzf project-source.tar.gz
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar conteúdo, módulos, atlas, idioma, tipografia e bundle
        run: npm run qa:all
