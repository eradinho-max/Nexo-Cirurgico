name: Validar fonte e acessibilidade Nexo Cirúrgico
on:
  push:
    paths:
      - 'project-source.tar.gz'
      - '.github/workflows/source-sync.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair fontes
        run: tar -xzf project-source.tar.gz
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar conteudo e materiais
        run: npm run qa
      - name: Validar fonte, idioma e bundle publico
        run: |
          npm run qa:typography
          npm run qa:reader-lang
          npm run build
          npm run qa:deploy
