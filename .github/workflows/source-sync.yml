name: Validar fonte e idiomas Nexo Cirúrgico
on:
  push:
    paths:
      - 'project-source.tar.gz'
      - '.github/workflows/source-sync.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair fontes
        run: tar -xzf project-source.tar.gz
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar conteudo, idiomas, fonte e build
        run: npm run qa:all
