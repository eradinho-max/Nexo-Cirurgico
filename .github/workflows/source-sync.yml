name: Validar MB04 e integridade do projeto
on:
  push:
    paths:
      - 'project-source.tar.gz'
      - '.github/workflows/source-sync.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair código-fonte
        run: tar -xzf project-source.tar.gz
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Auditoria de conteúdo, MB04, idioma, tipografia e build
        run: npm run qa:all
